name: Update Calendar

on:
  schedule:
    # Every Monday at 10:00 UTC (12:00 CET)
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run scraper
        run: uv run python anait_lanzamientos.py --verbose

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add anait_lanzamientos.ics anait_state.json
          git diff --staged --quiet || git commit -m "cal: update $(date -u +%Y-%m-%d)"
          git push
