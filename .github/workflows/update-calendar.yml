name: Update Calendar

on:
  schedule:
    # Every hour
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run scraper
        id: scraper
        run: |
          uv run python anait_lanzamientos.py --verbose 2>&1 | tee scraper.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add anait_lanzamientos.ics anait_state.json
          git diff --staged --quiet || git commit -m "cal: update $(date -u +%Y-%m-%d)"
          git push

      - name: Open issue on scraper failure
        if: steps.scraper.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # One open alert at a time: the job runs hourly, so a persistent
          # failure would otherwise open a new issue every hour.
          OPEN=$(gh issue list --state open --label bug \
            --search '"Scraper alert" in:title' --json number --jq 'length')
          if [ "$OPEN" != "0" ]; then
            echo "An open scraper alert already exists; not opening another."
            exit 0
          fi
          LOG_CONTENT=$(cat scraper.log)
          gh issue create \
            --title "Scraper alert: run failed" \
            --body "The scraper exited with an error. Look for the \`[error]\` line in the log:

          - **0 games parsed** from an article: the HTML format on AnaitGames has probably changed.
          - **API returned no articles** or **no article matched the weekly URL pattern**: the WordPress endpoint is down, or the tag ID / URL structure changed. While this persists the calendar gets no commits, and GitHub disables scheduled workflows after 60 days without repository activity.

          **Scraper log:**
          \`\`\`
          ${LOG_CONTENT}
          \`\`\`

          Check the [workflow run](${RUN_URL}) for details." \
            --label "bug"

      # GitHub disables cron-triggered workflows in public repos after 60 days
      # without repository activity. Normally the weekly calendar commit resets
      # that counter, but if AnaitGames stops publishing (or the API dies) the
      # commits stop. Re-enabling the workflow on every run is the same trick
      # keepalive-workflow uses, and it does not need dummy commits.
      - name: Keep scheduled workflow alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable update-calendar.yml
